name: ping-forecast-daily

on:
  schedule:
    - cron: "0 1 * * *"        # 01:00 UTC = 08:00 Asia/Bangkok
  workflow_dispatch:

concurrency:
  group: forecast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run forecast job
        run: python forecast.py
      - name: Commit updated log + dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add forecast_log.csv docs/index.html
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "forecast $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi
